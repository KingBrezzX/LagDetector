name: Build LagDetector

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v7

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # --------------------------------------------------
      # Environment information
      # --------------------------------------------------
      - name: Show environment
        run: |
          echo "Java version:"
          java -version

          echo
          echo "Maven version:"
          mvn --version

      # --------------------------------------------------
      # Validate Maven project
      # --------------------------------------------------
      - name: Validate Maven project
        run: |
          mvn --batch-mode --no-transfer-progress validate

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build with Maven
        run: |
          mvn --batch-mode --no-transfer-progress clean package

      # --------------------------------------------------
      # Verify JAR
      # --------------------------------------------------
      - name: Verify build output
        shell: bash
        run: |
          set -e

          echo "Build output:"
          ls -lah target/

          JAR_COUNT=$(find target -maxdepth 1 -type f -name "*.jar" | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "::error::No JAR file was generated."
            exit 1
          fi

          echo
          echo "Generated JAR files:"
          find target -maxdepth 1 -type f -name "*.jar" -print

      # --------------------------------------------------
      # Prepare artifact
      # --------------------------------------------------
      - name: Prepare plugin artifact
        shell: bash
        run: |
          set -e

          rm -rf staging
          mkdir -p staging

          find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} staging/ \;

          echo "Artifact contents:"
          ls -lah staging/

      # --------------------------------------------------
      # Upload JAR
      # --------------------------------------------------
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: LagDetector-${{ github.sha }}
          path: staging/*.jar
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # Build summary
      # --------------------------------------------------
      - name: Build summary
        shell: bash
        run: |
          {
            echo "## ⚡ LagDetector Build"
            echo
            echo "### Status"
            echo "✅ Maven build completed successfully"
            echo
            echo "### Java"
            java -version 2>&1 | head -n 1
            echo
            echo "### Generated JAR"
            for file in staging/*.jar; do
              echo "- \`$(basename "$file")\`"
            done
            echo
            echo "### Commit"
            echo "\`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
